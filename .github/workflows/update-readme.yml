name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    name: Refresh stats, projects and activity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Generate README sections and stat cards
        env:
          # Optional: add a PROFILE_TOKEN secret (a classic token with read:user) to include
          # private contributions in the totals. Otherwise the built-in token counts public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node .github/scripts/update-profile.mjs

      - name: Commit changes, if any
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated
          git commit -m "chore: refresh profile stats and projects"
          git push
